[package]
name = "forksync"
version = "2026.10.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Cross-platform GitHub fork sync with interactive terminal UI"
readme = "README.md"
keywords = ["github", "fork", "sync", "tui"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
indicatif = "0.17"
inquire = "0.9"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
